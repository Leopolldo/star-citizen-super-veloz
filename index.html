<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SC-NET // STAR CITIZEN WIKI API TERMINAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #04040a;
      --bg-panel: #0a0a16;
      --bg-card: #0e0f1f;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-yellow: #fcee0a;
      --neon-green: #00ff9d;
      --text-main: #e2e8f0;
      --text-dim: #7a86a8;
      --border-cyber: rgba(0, 243, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-void);
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Scanlines CRT sutis */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.14) 0px,
        rgba(0, 0, 0, 0.14) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* Header HUD */
    header {
      background: rgba(8, 8, 18, 0.94);
      border-bottom: 2px solid var(--neon-pink);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.25);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .cyber-tag {
      background: var(--neon-yellow);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.75rem;
      padding: 0.3rem 0.55rem;
      clip-path: polygon(0 0, 100% 0, 88% 100%, 0% 100%);
      letter-spacing: 1px;
    }

    .logo-box h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-cyan);
    }

    .logo-sub {
      font-size: 0.78rem;
      color: var(--neon-cyan);
      letter-spacing: 1.5px;
    }

    /* Tabs de Endpoints da API */
    .endpoint-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border-cyber);
      color: var(--text-dim);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.55rem 1rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      transition: all 0.2s;
    }

    .tab-btn:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .tab-btn.active {
      background: var(--neon-cyan);
      color: #000;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
    }

    .hud-telemetry {
      display: flex;
      gap: 1.2rem;
      font-size: 0.85rem;
      border-left: 2px solid var(--neon-yellow);
      padding-left: 1rem;
    }

    .hud-telemetry span {
      color: var(--text-dim);
    }

    .hud-telemetry strong {
      color: var(--neon-yellow);
      font-size: 1rem;
    }

    /* Barra de Status / Progresso */
    #status-bar {
      background: #070712;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      padding: 0.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.82rem;
      color: var(--neon-green);
    }

    .progress-rail {
      flex: 1;
      height: 5px;
      background: #14162b;
      position: relative;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
      box-shadow: 0 0 10px var(--neon-cyan);
      transition: width 0.25s ease;
    }

    /* Painel de Controles */
    .controls {
      max-width: 1500px;
      margin: 1.5rem auto;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 1rem;
    }

    @media (max-width: 960px) {
      .controls { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 580px) {
      .controls { grid-template-columns: 1fr; }
    }

    input, select {
      background: var(--bg-panel);
      border: 1px solid var(--border-cyber);
      color: var(--neon-cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      outline: none;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }

    input::placeholder {
      color: #4d5b7c;
    }

    input:focus, select:focus {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 12px rgba(252, 238, 10, 0.25);
    }

    .btn-purge {
      background: var(--neon-pink);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.75rem 1.4rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .btn-purge:hover {
      box-shadow: 0 0 18px rgba(255, 0, 85, 0.6);
      transform: translateY(-1px);
    }

    /* Grid de Cards Cyberpunk */
    .grid {
      max-width: 1500px;
      margin: 0 auto 4rem;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .cyber-card {
      background: var(--bg-card);
      border: 1px solid var(--border-cyber);
      position: relative;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .cyber-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--neon-cyan);
      transition: background 0.2s;
    }

    .cyber-card:hover {
      transform: translateY(-4px);
      border-color: var(--neon-yellow);
      box-shadow: 0 10px 30px rgba(0, 243, 255, 0.18);
    }

    .cyber-card:hover::before {
      background: var(--neon-yellow);
    }

    /* Visor Holográfico Procedural (Substitui imagens bloqueadas por arte HUD técnica) */
    .holo-viewport {
      height: 155px;
      background: 
        radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.12) 0%, rgba(4, 4, 10, 0.95) 80%),
        repeating-linear-gradient(90deg, rgba(0, 243, 255, 0.06) 0 1px, transparent 1px 20px);
      border-bottom: 1px solid rgba(0, 243, 255, 0.25);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .holo-scan {
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(to bottom, transparent, rgba(0, 243, 255, 0.22), transparent);
      animation: scanMove 3.5s linear infinite;
      pointer-events: none;
    }

    @keyframes scanMove {
      0% { top: -40%; }
      100% { top: 120%; }
    }

    .holo-code {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 0.68rem;
      color: var(--neon-cyan);
      opacity: 0.8;
    }

    .holo-status {
      position: absolute;
      top: 8px;
      right: 16px;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.18rem 0.5rem;
      text-transform: uppercase;
      border: 1px solid currentColor;
      background: rgba(4, 4, 10, 0.85);
    }

    .st-ready { color: var(--neon-green); }
    .st-concept { color: var(--neon-yellow); }
    .st-prod { color: var(--neon-pink); }

    .holo-svg {
      width: 190px;
      height: 95px;
      filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.65));
      transition: transform 0.3s ease;
    }

    .cyber-card:hover .holo-svg {
      transform: scale(1.08);
      filter: drop-shadow(0 0 12px rgba(252, 238, 10, 0.8));
    }

    .card-content {
      padding: 1.15rem 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-mfg {
      font-size: 0.75rem;
      color: var(--neon-pink);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: bold;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      color: #fff;
      margin: 0.3rem 0 0.45rem;
      letter-spacing: 0.5px;
    }

    .card-role {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }

    .card-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      border-top: 1px dashed rgba(0, 243, 255, 0.25);
      padding-top: 0.75rem;
    }

    .metric small {
      display: block;
      font-size: 0.65rem;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .metric strong {
      font-size: 0.9rem;
      color: var(--neon-cyan);
    }

    /* Modal Terminal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 2, 8, 0.9);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-terminal {
      background: var(--bg-panel);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.3);
      max-width: 880px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
    }

    .modal-top {
      background: rgba(0, 243, 255, 0.08);
      border-bottom: 1px solid var(--neon-cyan);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .modal-top h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      color: var(--neon-yellow);
      text-transform: uppercase;
    }

    .btn-close {
      background: var(--neon-pink);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-desc {
      color: #cbd5e1;
      line-height: 1.65;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      border-left: 3px solid var(--neon-pink);
      padding-left: 1rem;
    }

    .modal-specs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .spec-box {
      background: #070812;
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 0.8rem;
    }

    .spec-box span {
      display: block;
      font-size: 0.68rem;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .spec-box strong {
      font-size: 1rem;
      color: var(--neon-green);
    }

    .modal-footer-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn-cyber-link {
      background: var(--neon-yellow);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.78rem;
      padding: 0.75rem 1.3rem;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-json {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.88rem;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
    }

    .btn-json:hover {
      background: rgba(0, 243, 255, 0.15);
    }

    pre.raw-json {
      margin-top: 1rem;
      background: #030308;
      border: 1px solid var(--neon-pink);
      color: var(--neon-green);
      padding: 1rem;
      font-size: 0.78rem;
      max-height: 280px;
      overflow: auto;
      display: none;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--neon-pink);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-box">
      <div class="cyber-tag">API v2 // LIVE</div>
      <div>
        <h1>STAR CITIZEN // NET</h1>
        <div class="logo-sub">DATA STREAM: https://api.star-citizen.wiki</div>
      </div>
    </div>

    <div class="endpoint-tabs" id="endpoint-tabs">
      <button class="tab-btn active" data-endpoint="vehicles">/vehicles</button>
      <button class="tab-btn" data-endpoint="manufacturers">/manufacturers</button>
      <button class="tab-btn" data-endpoint="systems">/systems</button>
      <button class="tab-btn" data-endpoint="commodities">/commodities</button>
    </div>

    <div class="hud-telemetry">
      <div><span>CARREGADOS:</span> <strong id="stat-total">0</strong></div>
      <div><span>FILTRADOS:</span> <strong id="stat-shown">0</strong></div>
    </div>
  </header>

  <div id="status-bar">
    <span id="status-text">[SYS] INICIALIZANDO LINK COM API.STAR-CITIZEN.WIKI...</span>
    <div class="progress-rail">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <section class="controls">
    <input type="text" id="search-input" placeholder=">> DIGITE NOME, CÓDIGO OU FABRICANTE PARA FILTRAR..." />
    <select id="filter-primary">
      <option value="">[FILTRO 1: TODOS]</option>
    </select>
    <select id="filter-secondary">
      <option value="">[FILTRO 2: TODOS]</option>
    </select>
    <button class="btn-purge" id="btn-reset">RESETAR</button>
  </section>

  <main class="grid" id="data-grid"></main>

  <!-- Modal Terminal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-terminal" role="dialog" aria-modal="true">
      <div class="modal-top">
        <div>
          <span id="modal-sub" style="font-size:0.75rem;color:var(--neon-cyan);display:block;"></span>
          <h2 id="modal-title">DADOS DO SISTEMA</h2>
        </div>
        <button class="btn-close" id="modal-close">X</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    const API_HOST = 'https://api.star-citizen.wiki/api/v2';
    let currentEndpoint = 'vehicles';
    const endpointStore = new Map();
    const detailCache = new Map();

    const gridEl = document.getElementById('data-grid');
    const searchInput = document.getElementById('search-input');
    const filter1 = document.getElementById('filter-primary');
    const filter2 = document.getElementById('filter-secondary');
    const resetBtn = document.getElementById('btn-reset');
    const statTotal = document.getElementById('stat-total');
    const statShown = document.getElementById('stat-shown');
    const statusText = document.getElementById('status-text');
    const progressBar = document.getElementById('progress-bar');
    const modalOverlay = document.getElementById('modal-overlay');

    function getText(val, fallback = 'N/D') {
      if (val === null || val === undefined) return fallback;
      if (typeof val === 'string') return val.trim() || fallback;
      if (typeof val === 'number') return String(val);
      if (Array.isArray(val)) {
        const joined = val.map(x => getText(x, '')).filter(Boolean).join(' / ');
        return joined || fallback;
      }
      if (typeof val === 'object') {
        return val.en_EN || val.pt_BR || val.name || Object.values(val).find(v => typeof v === 'string') || fallback;
      }
      return fallback;
    }

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Gera silhueta vetorial holográfica baseada no porte/tipo do item
    function getCyberHologramSVG(item, endpoint) {
      const sizeStr = getText(item.size || item.type || item.code, '').toLowerCase();
      if (endpoint === 'manufacturers') {
        return `<svg class="holo-svg" viewBox="0 0 200 100" fill="none" stroke="#00f3ff" stroke-width="2">
          <polygon points="100,10 175,35 175,75 100,92 25,75 25,35" fill="rgba(0,243,255,0.06)"/>
          <polygon points="100,24 155,42 155,68 100,80 45,68 45,42" stroke="#ff0055" stroke-width="1.5"/>
          <circle cx="100" cy="52" r="10" stroke="#fcee0a"/>
        </svg>`;
      }
      if (endpoint === 'systems') {
        return `<svg class="holo-svg" viewBox="0 0 200 100" fill="none" stroke="#00f3ff" stroke-width="1.5">
          <circle cx="100" cy="50" r="14" fill="rgba(252,238,10,0.25)" stroke="#fcee0a" stroke-width="2"/>
          <ellipse cx="100" cy="50" rx="45" ry="16" stroke="#00f3ff"/>
          <ellipse cx="100" cy="50" rx="78" ry="28" stroke="#ff0055" stroke-dasharray="4 3"/>
          <circle cx="145" cy="50" r="4" fill="#00ff9d"/>
          <circle cx="32" cy="42" r="5" fill="#00f3ff"/>
        </svg>`;
      }
      if (endpoint === 'commodities') {
        return `<svg class="holo-svg" viewBox="0 0 200 100" fill="none" stroke="#00f3ff" stroke-width="2">
          <polygon points="100,15 150,38 150,72 100,90 50,72 50,38" fill="rgba(0,243,255,0.08)"/>
          <line x1="100" y1="15" x2="100" y2="52" stroke="#fcee0a"/>
          <line x1="50" y1="38" x2="100" y2="52" stroke="#fcee0a"/>
          <line x1="150" y1="38" x2="100" y2="52" stroke="#fcee0a"/>
          <line x1="100" y1="52" x2="100" y2="90" stroke="#ff0055"/>
        </svg>`;
      }
      // Naves grandes / capitais
      if (sizeStr.includes('capital') || sizeStr.includes('large') || sizeStr.includes('heavy')) {
        return `<svg class="holo-svg" viewBox="0 0 220 100" fill="none" stroke="#00f3ff" stroke-width="1.8">
          <polygon points="15,52 65,30 165,26 205,46 205,58 165,76 65,72" fill="rgba(0,243,255,0.08)"/>
          <polygon points="75,38 155,36 180,50 155,64 75,62" stroke="#ff0055" stroke-width="1.4"/>
          <line x1="25" y1="52" x2="195" y2="52" stroke="#fcee0a" stroke-dasharray="5 3"/>
          <rect x="40" y="44" width="18" height="16" stroke="#00ff9d"/>
        </svg>`;
      }
      // Caças / Naves médias padrão
      return `<svg class="holo-svg" viewBox="0 0 220 100" fill="none" stroke="#00f3ff" stroke-width="1.8">
        <polygon points="195,50 130,36 75,16 45,38 22,44 22,56 45,62 75,84 130,64" fill="rgba(0,243,255,0.08)"/>
        <polygon points="155,50 110,42 75,50 110,58" stroke="#fcee0a" stroke-width="1.5"/>
        <line x1="30" y1="50" x2="185" y2="50" stroke="#ff0055" stroke-dasharray="4 3"/>
      </svg>`;
    }

    async function loadEndpoint(endpoint) {
      currentEndpoint = endpoint;
      searchInput.value = '';
      filter1.value = '';
      filter2.value = '';

      if (endpointStore.has(endpoint)) {
        const cached = endpointStore.get(endpoint);
        statTotal.textContent = cached.length;
        statusText.textContent = `[OK] ENDPOINT /${endpoint.toUpperCase()} CARREGADO DO CACHE (${cached.length} REGISTROS)`;
        progressBar.style.width = '100%';
        setupFilters(cached, endpoint);
        renderItems();
        return;
      }

      const items = [];
      statusText.textContent = `[NET] CONECTANDO A ${API_HOST}/${endpoint}...`;
      progressBar.style.width = '10%';
      gridEl.innerHTML = '';

      try {
        const firstRes = await fetch(`${API_HOST}/${endpoint}?limit=100&page=1`, {
          headers: { 'Accept': 'application/json' }
        });
        if (!firstRes.ok) throw new Error(`HTTP ${firstRes.status}`);

        const firstJson = await firstRes.json();
        items.push(...(firstJson.data || []));
        endpointStore.set(endpoint, items);

        const lastPage = firstJson.meta?.last_page || 1;
        const total = firstJson.meta?.total || items.length;

        statTotal.textContent = items.length;
        progressBar.style.width = `${Math.round((1 / lastPage) * 100)}%`;
        statusText.textContent = `[STREAM] RECEBENDO /${endpoint.toUpperCase()} (${items.length}/${total})...`;
        setupFilters(items, endpoint);
        renderItems();

        if (lastPage > 1) {
          const pages = [];
          for (let p = 2; p <= lastPage; p++) pages.push(p);

          const batchSize = 4;
          let done = 1;

          for (let i = 0; i < pages.length; i += batchSize) {
            if (currentEndpoint !== endpoint) return; // Usuário trocou de aba
            const batch = pages.slice(i, i + batchSize);
            const results = await Promise.all(
              batch.map(p =>
                fetch(`${API_HOST}/${endpoint}?limit=100&page=${p}`, {
                  headers: { 'Accept': 'application/json' }
                })
                  .then(r => r.ok ? r.json() : { data: [] })
                  .catch(() => ({ data: [] }))
              )
            );

            results.forEach(r => {
              if (Array.isArray(r.data)) items.push(...r.data);
            });

            done += batch.length;
            statTotal.textContent = items.length;
            progressBar.style.width = `${Math.min(100, Math.round((done / lastPage) * 100))}%`;
            statusText.textContent = `[STREAM] RECEBENDO /${endpoint.toUpperCase()} (${items.length}/${total})...`;
            setupFilters(items, endpoint);
            renderItems();
          }
        }

        progressBar.style.width = '100%';
        statusText.textContent = `[ONLINE] ${items.length} REGISTROS SINCRONIZADOS DE API.STAR-CITIZEN.WIKI/API/V2/${endpoint.toUpperCase()}`;
      } catch (err) {
        console.error(err);
        statusText.textContent = `[ERRO] FALHA NA CONEXÃO COM /${endpoint.toUpperCase()}: ${err.message}`;
        progressBar.style.background = '#ff0055';
      }
    }

    function setupFilters(items, endpoint) {
      const v1 = filter1.value;
      const v2 = filter2.value;
      const set1 = new Set();
      const set2 = new Set();

      if (endpoint === 'vehicles') {
        items.forEach(it => {
          if (it.manufacturer?.name) set1.add(it.manufacturer.name);
          const st = getText(it.production_status, '');
          if (st) set2.add(st);
        });
        fillSelect(filter1, [...set1].sort(), '[FABRICANTE: TODOS]', v1);
        fillSelect(filter2, [...set2].sort(), '[STATUS: TODOS]', v2);
      } else if (endpoint === 'systems') {
        items.forEach(it => {
          const type = getText(it.type, '');
          const aff = getText(it.affiliation, '');
          if (type) set1.add(type);
          if (aff) set2.add(aff);
        });
        fillSelect(filter1, [...set1].sort(), '[TIPO: TODOS]', v1);
        fillSelect(filter2, [...set2].sort(), '[AFILIAÇÃO: TODAS]', v2);
      } else if (endpoint === 'commodities') {
        items.forEach(it => {
          const type = getText(it.type, '');
          if (type) set1.add(type);
        });
        fillSelect(filter1, [...set1].sort(), '[CATEGORIA: TODAS]', v1);
        fillSelect(filter2, [], '[FILTRO 2: INATIVO]', '');
      } else {
        items.forEach(it => {
          if (it.code) set1.add(it.code);
        });
        fillSelect(filter1, [...set1].sort(), '[CÓDIGO: TODOS]', v1);
        fillSelect(filter2, [], '[FILTRO 2: INATIVO]', '');
      }
    }

    function fillSelect(el, arr, label, currentVal) {
      el.innerHTML = `<option value="">${label}</option>` +
        arr.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('');
      el.value = currentVal;
    }

    function renderItems() {
      const items = endpointStore.get(currentEndpoint) || [];
      const q = searchInput.value.trim().toLowerCase();
      const f1 = filter1.value;
      const f2 = filter2.value;

      const filtered = items.filter(it => {
        const name = getText(it.name, '').toLowerCase();
        const code = getText(it.code, '').toLowerCase();
        const mfg = (it.manufacturer?.name || '').toLowerCase();

        const matchQ = !q || name.includes(q) || code.includes(q) || mfg.includes(q);
        if (!matchQ) return false;

        if (currentEndpoint === 'vehicles') {
          const match1 = !f1 || it.manufacturer?.name === f1;
          const match2 = !f2 || getText(it.production_status, '') === f2;
          return match1 && match2;
        }
        if (currentEndpoint === 'systems') {
          const match1 = !f1 || getText(it.type, '') === f1;
          const match2 = !f2 || getText(it.affiliation, '') === f2;
          return match1 && match2;
        }
        if (currentEndpoint === 'commodities') {
          return !f1 || getText(it.type, '') === f1;
        }
        return !f1 || it.code === f1;
      });

      filtered.sort((a, b) => getText(a.name, '').localeCompare(getText(b.name, '')));
      statShown.textContent = filtered.length;

      if (filtered.length === 0) {
        gridEl.innerHTML = `<div class="empty-msg">[!] NENHUM REGISTRO ENCONTRADO NO SETOR SELECIONADO.</div>`;
        return;
      }

      const frag = document.createDocumentFragment();

      filtered.forEach(it => {
        const card = document.createElement('article');
        card.className = 'cyber-card';

        let topTag = '';
        let badgeText = '';
        let badgeClass = 'st-ready';
        let subtitle = '';
        let roleText = '';
        let m1 = ['-', '-'], m2 = ['-', '-'], m3 = ['-', '-'];

        if (currentEndpoint === 'vehicles') {
          topTag = `UUID // ${(it.uuid || 'SYS').slice(0, 8).toUpperCase()}`;
          badgeText = getText(it.production_status, 'ATIVO');
          const low = badgeText.toLowerCase();
          badgeClass = low.includes('flight') || low.includes('ready') ? 'st-ready' : (low.includes('concept') ? 'st-concept' : 'st-prod');
          subtitle = it.manufacturer?.name || 'FABRICANTE DESCONHECIDO';
          roleText = getText(it.focus, 'MULTIFUNÇÃO');
          m1 = ['CARGA', it.cargo_capacity != null ? `${it.cargo_capacity} SCU` : '0 SCU'];
          m2 = ['TRIPULAÇÃO', it.crew?.max ?? it.max_crew ?? '1'];
          m3 = ['COMPR.', it.sizes?.length != null ? `${it.sizes.length}m` : (it.length != null ? `${it.length}m` : 'N/D')];
        } else if (currentEndpoint === 'manufacturers') {
          topTag = `CODE // ${it.code || 'MFG'}`;
          badgeText = it.code || 'CORP';
          subtitle = 'CORPORAÇÃO // UEE REGISTRY';
          roleText = getText(it.known_for, 'Fabricante Aeroespacial & Defesa');
          m1 = ['CÓDIGO', it.code || 'N/D'];
          m2 = ['NAVES', it.ships_count ?? 'API'];
          m3 = ['VEÍCULOS', it.vehicles_count ?? 'API'];
        } else if (currentEndpoint === 'systems') {
          topTag = `SYS // ${it.code || 'STAR'}`;
          badgeText = getText(it.affiliation, 'INDEPENDENTE');
          subtitle = `TIPO: ${getText(it.type, 'SISTEMA ESTELAR')}`;
          roleText = `STATUS: ${getText(it.status, 'MAPEADO')}`;
          m1 = ['TIPO', getText(it.type, 'N/D')];
          m2 = ['AFILIAÇÃO', getText(it.affiliation, 'N/D')];
          m3 = ['JUMP PTS', Array.isArray(it.jump_points) ? it.jump_points.length : 'N/D'];
        } else {
          topTag = `RES // ${it.symbol || 'CMD'}`;
          badgeText = getText(it.type, 'COMMODITY');
          subtitle = `SÍMBOLO: ${it.symbol || 'N/D'}`;
          roleText = getText(it.description, 'Recurso comercializável no universo Stanton/Pyro');
          m1 = ['SÍMBOLO', it.symbol || 'N/D'];
          m2 = ['TIPO', getText(it.type, 'N/D')];
          m3 = ['REFINÁVEL', it.refined ? 'SIM' : 'NÃO'];
        }

        card.innerHTML = `
          <div class="holo-viewport">
            <div class="holo-scan"></div>
            <span class="holo-code">${esc(topTag)}</span>
            <span class="holo-status ${badgeClass}">${esc(badgeText)}</span>
            ${getCyberHologramSVG(it, currentEndpoint)}
          </div>
          <div class="card-content">
            <div>
              <div class="card-mfg">${esc(subtitle)}</div>
              <h3 class="card-title">${esc(getText(it.name, 'SEM IDENTIFICAÇÃO'))}</h3>
              <div class="card-role">${esc(roleText.slice(0, 85))}${roleText.length > 85 ? '...' : ''}</div>
            </div>
            <div class="card-metrics">
              <div class="metric"><small>${esc(m1[0])}</small><strong>${esc(String(m1[1]))}</strong></div>
              <div class="metric"><small>${esc(m2[0])}</small><strong>${esc(String(m2[1]))}</strong></div>
              <div class="metric"><small>${esc(m3[0])}</small><strong>${esc(String(m3[1]))}</strong></div>
            </div>
          </div>
        `;

        card.addEventListener('click', () => openItemModal(it));
        frag.appendChild(card);
      });

      gridEl.innerHTML = '';
      gridEl.appendChild(frag);
    }

    async function openItemModal(item) {
      const title = getText(item.name, 'REGISTRO');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-sub').textContent = `ENDPOINT // ${API_HOST}/${currentEndpoint}/${item.uuid || item.code || item.slug || ''}`;
      modalOverlay.classList.add('open');

      const id = item.uuid || item.code || item.slug || title;
      const cacheKey = `${currentEndpoint}:${id}`;

      renderModalDetails(item, true);

      if (detailCache.has(cacheKey)) {
        renderModalDetails(detailCache.get(cacheKey), false);
        return;
      }

      try {
        const lookup = item.uuid || item.code || item.slug;
        if (lookup) {
          const res = await fetch(`${API_HOST}/${currentEndpoint}/${encodeURIComponent(lookup)}`, {
            headers: { 'Accept': 'application/json' }
          });
          if (res.ok) {
            const json = await res.json();
            const full = json.data ? { ...item, ...json.data } : item;
            detailCache.set(cacheKey, full);
            renderModalDetails(full, false);
            return;
          }
        }
      } catch (e) {
        console.warn('Detalhes adicionais não disponíveis:', e);
      }

      renderModalDetails(item, false);
    }

    function renderModalDetails(data, loading) {
      const desc = getText(data.description, 'Nenhuma descrição adicional registrada no banco de dados da Star Citizen Wiki API.');
      const wikiUrl = data.web_url || `https://starcitizen.tools/${encodeURIComponent(getText(data.name, '').replace(/\s+/g, '_'))}`;

      let boxes = [];

      if (currentEndpoint === 'vehicles') {
        boxes = [
          ['Fabricante', data.manufacturer?.name || 'N/D'],
          ['Status', getText(data.production_status)],
          ['Função (Focus)', getText(data.focus)],
          ['Porte / Classe', `${getText(data.type)} (${getText(data.size)})`],
          ['Capacidade Cargo', data.cargo_capacity != null ? `${data.cargo_capacity} SCU` : 'N/D'],
          ['Tripulação Min/Max', `${data.crew?.min ?? '?'} / ${data.crew?.max ?? '?'}`],
          ['Dimensões (C×L×A)', `${data.sizes?.length ?? '?'}m × ${data.sizes?.beam ?? '?'}m × ${data.sizes?.height ?? '?'}m`],
          ['Massa Total', data.mass != null ? `${Number(data.mass).toLocaleString('pt-BR')} kg` : 'N/D'],
          ['Velocidade SCM / Máx', `${data.speed?.scm ?? '?'} / ${data.speed?.max ?? '?'} m/s`],
          ['Valor Pledge (MSRP)', data.msrp != null ? `$${Number(data.msrp).toLocaleString('en-US')} USD` : 'N/D']
        ];
      } else {
        Object.entries(data).forEach(([k, v]) => {
          if (v !== null && typeof v !== 'object' && k !== 'description' && k !== 'uuid' && k !== 'web_url' && k !== 'link') {
            boxes.push([k.replace(/_/g, ' '), String(v)]);
          }
        });
      }

      document.getElementById('modal-body').innerHTML = `
        ${loading ? `<div style="color:var(--neon-yellow);margin-bottom:0.8rem;">[SYNC] CARREGANDO TELEMETRIA COMPLETA DA API...</div>` : ''}
        <p class="modal-desc">${esc(desc)}</p>
        <div class="modal-specs">
          ${boxes.slice(0, 12).map(([label, val]) => `
            <div class="spec-box">
              <span>${esc(label)}</span>
              <strong>${esc(val)}</strong>
            </div>
          `).join('')}
        </div>
        <div class="modal-footer-btns">
          <a class="btn-cyber-link" href="${esc(wikiUrl)}" target="_blank" rel="noopener noreferrer">ABRIR NA WIKI &nearr;</a>
          <button type="button" class="btn-json" id="btn-toggle-json">{ } INSPECIONAR JSON BRUTO</button>
        </div>
        <pre class="raw-json" id="raw-json-box">${esc(JSON.stringify(data, null, 2))}</pre>
      `;

      document.getElementById('btn-toggle-json').addEventListener('click', () => {
        const pre = document.getElementById('raw-json-box');
        pre.style.display = pre.style.display === 'block' ? 'none' : 'block';
      });
    }

    // Troca de tabs dos endpoints
    document.getElementById('endpoint-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadEndpoint(btn.getAttribute('data-endpoint'));
    });

    // Eventos de filtro e modal
    searchInput.addEventListener('input', renderItems);
    filter1.addEventListener('change', renderItems);
    filter2.addEventListener('change', renderItems);

    resetBtn.addEventListener('click', () => {
      searchInput.value = '';
      filter1.value = '';
      filter2.value = '';
      renderItems();
    });

    document.getElementById('modal-close').addEventListener('click', () => modalOverlay.classList.remove('open'));
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('open'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modalOverlay.classList.remove('open'); });

    // Inicia carregando /vehicles da Star Citizen Wiki API
    loadEndpoint('vehicles');
  </script>
</body>
</html>
