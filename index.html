<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Veloz — Star Citizen Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #04040a;
      --bg-panel: #090a15;
      --bg-card: #0e1021;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-yellow: #fcee0a;
      --neon-green: #00ff9d;
      --neon-purple: #b829ff;
      --text-main: #e2e8f0;
      --text-dim: #7a86a8;
      --border-cyber: rgba(0, 243, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-void);
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.14) 0px,
        rgba(0, 0, 0, 0.14) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* Header HUD */
    header {
      background: rgba(8, 8, 18, 0.96);
      border-bottom: 2px solid var(--neon-pink);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.25);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.9rem;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .cyber-tag {
      background: var(--neon-yellow);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.75rem;
      padding: 0.3rem 0.55rem;
      clip-path: polygon(0 0, 100% 0, 88% 100%, 0% 100%);
      letter-spacing: 1px;
    }

    .logo-box h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-cyan);
    }

    .logo-sub {
      font-size: 0.78rem;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }

    .hud-telemetry {
      display: flex;
      gap: 1.2rem;
      font-size: 0.85rem;
      border-left: 2px solid var(--neon-yellow);
      padding-left: 1rem;
    }

    .hud-telemetry span { color: var(--text-dim); }
    .hud-telemetry strong { color: var(--neon-yellow); font-size: 1rem; }

    /* Navegação Universal */
    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      padding-top: 0.6rem;
      border-top: 1px dashed rgba(0, 243, 255, 0.2);
    }

    .nav-group-label {
      font-size: 0.7rem;
      color: var(--neon-pink);
      text-transform: uppercase;
      margin-right: 0.3rem;
      font-weight: bold;
    }

    .tab-btn {
      background: rgba(14, 16, 33, 0.85);
      border: 1px solid var(--border-cyber);
      color: var(--text-dim);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
      transition: all 0.18s;
    }

    .tab-btn:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .tab-btn.active {
      background: var(--neon-cyan);
      color: #000;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 243, 255, 0.55);
    }

    /* Barra de Status */
    #status-bar {
      background: #070712;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      padding: 0.55rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.82rem;
      color: var(--neon-green);
    }

    .progress-rail {
      flex: 1;
      height: 6px;
      background: #14162b;
      position: relative;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
      box-shadow: 0 0 10px var(--neon-cyan);
      transition: width 0.2s ease;
    }

    .btn-load-all {
      background: rgba(0, 255, 157, 0.12);
      border: 1px solid var(--neon-green);
      color: var(--neon-green);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.3rem 0.75rem;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .btn-load-all:hover {
      background: var(--neon-green);
      color: #000;
    }

    /* Controles */
    .controls {
      max-width: 1550px;
      margin: 1.4rem auto;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1.3fr auto;
      gap: 0.85rem;
    }

    @media (max-width: 1150px) {
      .controls { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 600px) {
      .controls { grid-template-columns: 1fr; }
    }

    input, select {
      background: var(--bg-panel);
      border: 1px solid var(--border-cyber);
      color: var(--neon-cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.92rem;
      padding: 0.7rem 0.95rem;
      outline: none;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }

    input::placeholder { color: #4d5b7c; }
    input:focus, select:focus {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 12px rgba(252, 238, 10, 0.25);
    }

    .custom-route-wrap {
      display: flex;
      gap: 0.4rem;
    }

    .custom-route-wrap input {
      flex: 1;
      min-width: 130px;
      border-color: rgba(184, 41, 255, 0.5);
      color: var(--neon-yellow);
    }

    .btn-exec {
      background: var(--neon-purple);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-purge {
      background: var(--neon-pink);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .btn-purge:hover {
      box-shadow: 0 0 18px rgba(255, 0, 85, 0.6);
    }

    /* Grid Universal */
    .grid {
      max-width: 1550px;
      margin: 0 auto 4rem;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.4rem;
    }

    .cyber-card {
      background: var(--bg-card);
      border: 1px solid var(--border-cyber);
      position: relative;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .cyber-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--neon-cyan);
      transition: background 0.2s;
    }

    .cyber-card:hover {
      transform: translateY(-4px);
      border-color: var(--neon-yellow);
      box-shadow: 0 10px 30px rgba(0, 243, 255, 0.18);
    }

    .cyber-card:hover::before {
      background: var(--neon-yellow);
    }

    .holo-viewport {
      height: 155px;
      background: 
        radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.11) 0%, rgba(4, 4, 10, 0.96) 80%),
        repeating-linear-gradient(90deg, rgba(0, 243, 255, 0.05) 0 1px, transparent 1px 20px);
      border-bottom: 1px solid rgba(0, 243, 255, 0.22);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .holo-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.88;
      filter: contrast(1.1) saturate(1.2);
      transition: transform 0.35s ease, opacity 0.3s ease;
    }

    .cyber-card:hover .holo-viewport img {
      transform: scale(1.06);
      opacity: 1;
    }

    .holo-scan {
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 45%;
      background: linear-gradient(to bottom, transparent, rgba(0, 243, 255, 0.22), transparent);
      animation: scanMove 3.8s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes scanMove {
      0% { top: -45%; }
      100% { top: 120%; }
    }

    .holo-code {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 0.68rem;
      color: var(--neon-cyan);
      background: rgba(4, 4, 10, 0.82);
      padding: 0.12rem 0.4rem;
      z-index: 3;
    }

    .holo-status {
      position: absolute;
      top: 8px;
      right: 16px;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 0.16rem 0.48rem;
      text-transform: uppercase;
      border: 1px solid currentColor;
      background: rgba(4, 4, 10, 0.88);
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 3;
    }

    .st-green { color: var(--neon-green); }
    .st-yellow { color: var(--neon-yellow); }
    .st-pink { color: var(--neon-pink); }

    .holo-svg {
      width: 170px;
      height: 82px;
      filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.65));
      transition: transform 0.3s ease;
    }

    .cyber-card:hover .holo-svg {
      transform: scale(1.08);
      filter: drop-shadow(0 0 12px rgba(252, 238, 10, 0.8));
    }

    .card-content {
      padding: 1.1rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-mfg {
      font-size: 0.74rem;
      color: var(--neon-pink);
      text-transform: uppercase;
      letter-spacing: 1.3px;
      font-weight: bold;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.06rem;
      font-weight: 700;
      color: #fff;
      margin: 0.3rem 0 0.45rem;
      letter-spacing: 0.4px;
      line-height: 1.3;
    }

    .card-role {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .card-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      border-top: 1px dashed rgba(0, 243, 255, 0.25);
      padding-top: 0.75rem;
    }

    .metric small {
      display: block;
      font-size: 0.64rem;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .metric strong {
      font-size: 0.86rem;
      color: var(--neon-cyan);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Paginação */
    .pagination-bar {
      max-width: 1550px;
      margin: -2rem auto 4rem;
      padding: 0 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .btn-page {
      background: var(--bg-panel);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
    }

    .btn-page:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Modal Terminal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 2, 8, 0.9);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-overlay.open { display: flex; }

    .modal-terminal {
      background: var(--bg-panel);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.3);
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
    }

    .modal-top {
      background: rgba(0, 243, 255, 0.08);
      border-bottom: 1px solid var(--neon-cyan);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .modal-top h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: var(--neon-yellow);
      text-transform: uppercase;
    }

    .btn-close {
      background: var(--neon-pink);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
    }

    .modal-body { padding: 1.5rem; }

    .modal-hero {
      width: 100%;
      max-height: 340px;
      object-fit: cover;
      border: 1px solid var(--neon-cyan);
      margin-bottom: 1.2rem;
    }

    .modal-desc {
      color: #cbd5e1;
      line-height: 1.65;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      border-left: 3px solid var(--neon-pink);
      padding-left: 1rem;
      white-space: pre-line;
    }

    .modal-specs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .spec-box {
      background: #070812;
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 0.8rem;
    }

    .spec-box span {
      display: block;
      font-size: 0.68rem;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .spec-box strong {
      font-size: 0.98rem;
      color: var(--neon-green);
      word-break: break-word;
    }

    .modal-footer-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn-cyber-link {
      background: var(--neon-yellow);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.78rem;
      padding: 0.75
