<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Veloz — Star Citizen Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #04040a;
      --bg-panel: #090a15;
      --bg-card: #0e1021;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-yellow: #fcee0a;
      --neon-green: #00ff9d;
      --neon-purple: #b829ff;
      --text-main: #e2e8f0;
      --text-dim: #7a86a8;
      --border-cyber: rgba(0, 243, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-void);
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.14) 0px,
        rgba(0, 0, 0, 0.14) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* Header HUD */
    header {
      background: rgba(8, 8, 18, 0.96);
      border-bottom: 2px solid var(--neon-pink);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.25);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.9rem;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .cyber-tag {
      background: var(--neon-yellow);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.75rem;
      padding: 0.3rem 0.55rem;
      clip-path: polygon(0 0, 100% 0, 88% 100%, 0% 100%);
      letter-spacing: 1px;
    }

    .logo-box h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-cyan);
    }

    .logo-sub {
      font-size: 0.78rem;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }

    .hud-telemetry {
      display: flex;
      gap: 1.2rem;
      font-size: 0.85rem;
      border-left: 2px solid var(--neon-yellow);
      padding-left: 1rem;
    }

    .hud-telemetry span { color: var(--text-dim); }
    .hud-telemetry strong { color: var(--neon-yellow); font-size: 1rem; }

    /* Navegação Universal */
    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      padding-top: 0.6rem;
      border-top: 1px dashed rgba(0, 243, 255, 0.2);
    }

    .nav-group-label {
      font-size: 0.7rem;
      color: var(--neon-pink);
      text-transform: uppercase;
      margin-right: 0.3rem;
      font-weight: bold;
    }

    .tab-btn {
      background: rgba(14, 16, 33, 0.85);
      border: 1px solid var(--border-cyber);
      color: var(--text-dim);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
      transition: all 0.18s;
    }

    .tab-btn:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .tab-btn.active {
      background: var(--neon-cyan);
      color: #000;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 243, 255, 0.55);
    }

    /* Barra de Status */
    #status-bar {
      background: #070712;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      padding: 0.55rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.82rem;
      color: var(--neon-green);
    }

    .progress-rail {
      flex: 1;
      height: 5px;
      background: #14162b;
      position: relative;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
      box-shadow: 0 0 10px var(--neon-cyan);
      transition: width 0.25s ease;
    }

    /* Controles */
    .controls {
      max-width: 1550px;
      margin: 1.4rem auto;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1.3fr auto;
      gap: 0.85rem;
    }

    @media (max-width: 1150px) {
      .controls { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 600px) {
      .controls { grid-template-columns: 1fr; }
    }

    input, select {
      background: var(--bg-panel);
      border: 1px solid var(--border-cyber);
      color: var(--neon-cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.92rem;
      padding: 0.7rem 0.95rem;
      outline: none;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }

    input::placeholder { color: #4d5b7c; }
    input:focus, select:focus {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 12px rgba(252, 238, 10, 0.25);
    }

    .custom-route-wrap {
      display: flex;
      gap: 0.4rem;
    }

    .custom-route-wrap input {
      flex: 1;
      min-width: 130px;
      border-color: rgba(184, 41, 255, 0.5);
      color: var(--neon-yellow);
    }

    .btn-exec {
      background: var(--neon-purple);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-purge {
      background: var(--neon-pink);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .btn-purge:hover {
      box-shadow: 0 0 18px rgba(255, 0, 85, 0.6);
    }

    /* Grid Universal */
    .grid {
      max-width: 1550px;
      margin: 0 auto 4rem;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.4rem;
    }

    .cyber-card {
      background: var(--bg-card);
      border: 1px solid var(--border-cyber);
      position: relative;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .cyber-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--neon-cyan);
      transition: background 0.2s;
    }

    .cyber-card:hover {
      transform: translateY(-4px);
      border-color: var(--neon-yellow);
      box-shadow: 0 10px 30px rgba(0, 243, 255, 0.18);
    }

    .cyber-card:hover::before {
      background: var(--neon-yellow);
    }

    .holo-viewport {
      height: 155px;
      background: 
        radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.11) 0%, rgba(4, 4, 10, 0.96) 80%),
        repeating-linear-gradient(90deg, rgba(0, 243, 255, 0.05) 0 1px, transparent 1px 20px);
      border-bottom: 1px solid rgba(0, 243, 255, 0.22);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .holo-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.88;
      filter: contrast(1.1) saturate(1.2);
      transition: transform 0.35s ease, opacity 0.3s ease;
    }

    .cyber-card:hover .holo-viewport img {
      transform: scale(1.06);
      opacity: 1;
    }

    .holo-scan {
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 45%;
      background: linear-gradient(to bottom, transparent, rgba(0, 243, 255, 0.22), transparent);
      animation: scanMove 3.8s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes scanMove {
      0% { top: -45%; }
      100% { top: 120%; }
    }

    .holo-code {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 0.68rem;
      color: var(--neon-cyan);
      background: rgba(4, 4, 10, 0.82);
      padding: 0.12rem 0.4rem;
      z-index: 3;
    }

    .holo-status {
      position: absolute;
      top: 8px;
      right: 16px;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 0.16rem 0.48rem;
      text-transform: uppercase;
      border: 1px solid currentColor;
      background: rgba(4, 4, 10, 0.88);
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 3;
    }

    .st-green { color: var(--neon-green); }
    .st-yellow { color: var(--neon-yellow); }
    .st-pink { color: var(--neon-pink); }

    .holo-svg {
      width: 170px;
      height: 82px;
      filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.65));
      transition: transform 0.3s ease;
    }

    .cyber-card:hover .holo-svg {
      transform: scale(1.08);
      filter: drop-shadow(0 0 12px rgba(252, 238, 10, 0.8));
    }

    .card-content {
      padding: 1.1rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-mfg {
      font-size: 0.74rem;
      color: var(--neon-pink);
      text-transform: uppercase;
      letter-spacing: 1.3px;
      font-weight: bold;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.06rem;
      font-weight: 700;
      color: #fff;
      margin: 0.3rem 0 0.45rem;
      letter-spacing: 0.4px;
      line-height: 1.3;
    }

    .card-role {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .card-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      border-top: 1px dashed rgba(0, 243, 255, 0.25);
      padding-top: 0.75rem;
    }

    .metric small {
      display: block;
      font-size: 0.64rem;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .metric strong {
      font-size: 0.86rem;
      color: var(--neon-cyan);
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Paginação */
    .pagination-bar {
      max-width: 1550px;
      margin: -2rem auto 4rem;
      padding: 0 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .btn-page {
      background: var(--bg-panel);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
    }

    .btn-page:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Modal Terminal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 2, 8, 0.9);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-overlay.open { display: flex; }

    .modal-terminal {
      background: var(--bg-panel);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.3);
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
    }

    .modal-top {
      background: rgba(0, 243, 255, 0.08);
      border-bottom: 1px solid var(--neon-cyan);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .modal-top h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: var(--neon-yellow);
      text-transform: uppercase;
    }

    .btn-close {
      background: var(--neon-pink);
      border: none;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
    }

    .modal-body { padding: 1.5rem; }

    .modal-hero {
      width: 100%;
      max-height: 340px;
      object-fit: cover;
      border: 1px solid var(--neon-cyan);
      margin-bottom: 1.2rem;
    }

    .modal-desc {
      color: #cbd5e1;
      line-height: 1.65;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      border-left: 3px solid var(--neon-pink);
      padding-left: 1rem;
      white-space: pre-line;
    }

    .modal-specs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .spec-box {
      background: #070812;
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 0.8rem;
    }

    .spec-box span {
      display: block;
      font-size: 0.68rem;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .spec-box strong {
      font-size: 0.98rem;
      color: var(--neon-green);
      word-break: break-word;
    }

    .modal-footer-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn-cyber-link {
      background: var(--neon-yellow);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.78rem;
      padding: 0.75rem 1.3rem;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-json {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.88rem;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
    }

    .btn-json:hover { background: rgba(0, 243, 255, 0.15); }

    pre.raw-json {
      margin-top: 1rem;
      background: #030308;
      border: 1px solid var(--neon-pink);
      color: var(--neon-green);
      padding: 1rem;
      font-size: 0.78rem;
      max-height: 300px;
      overflow: auto;
      display: none;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--neon-pink);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo-box">
        <div class="cyber-tag">TURBO-DB</div>
        <div>
          <h1>SUPER VELOZ</h1>
          <div class="logo-sub">STAR CITIZEN WIKI API // CYBERNETIC TERMINAL</div>
        </div>
      </div>

      <div class="hud-telemetry">
        <div><span>ROTA ATIVA:</span> <strong id="stat-route">/v2/vehicles</strong></div>
        <div><span>REGISTROS:</span> <strong id="stat-total">0</strong></div>
        <div><span>EXIBINDO:</span> <strong id="stat-shown">0</strong></div>
      </div>
    </div>

    <nav class="nav-bar" id="nav-bar">
      <span class="nav-group-label">FROTA:</span>
      <button class="tab-btn active" data-route="v2/vehicles">Vehicles (Naves)</button>
      <button class="tab-btn" data-route="v2/manufacturers">Manufacturers</button>

      <span class="nav-group-label" style="margin-left:0.5rem;">GEAR & ITENS:</span>
      <button class="tab-btn" data-route="v2/weapons">Weapons</button>
      <button class="tab-btn" data-route="v2/armor">Armor</button>
      <button class="tab-btn" data-route="v2/clothing">Clothing</button>
      <button class="tab-btn" data-route="v2/items">Items (All)</button>

      <span class="nav-group-label" style="margin-left:0.5rem;">UNIVERSO & LORE:</span>
      <button class="tab-btn" data-route="v2/systems">Star Systems</button>
      <button class="tab-btn" data-route="v2/celestial-objects">Planets & Moons</button>
      <button class="tab-btn" data-route="v2/commodities">Commodities</button>
      <button class="tab-btn" data-route="v2/galactapedia">Galactapedia</button>
      <button class="tab-btn" data-route="v2/comm-links">Comm-Links</button>
    </nav>
  </header>

  <div id="status-bar">
    <span id="status-text">[SYS] AGUARDANDO CONEXÃO COM A REDE...</span>
    <div class="progress-rail">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <section class="controls">
    <input type="text" id="search-input" placeholder=">> BUSCAR POR NOME, FABRICANTE, CÓDIGO OU DESCRIÇÃO..." />
    <select id="filter-primary">
      <option value="">[FILTRO 1: TODOS]</option>
    </select>
    <select id="filter-secondary">
      <option value="">[FILTRO 2: TODOS]</option>
    </select>
    <div class="custom-route-wrap">
      <input type="text" id="custom-route-input" placeholder="Rota custom (ex: v2/shields)" title="Digite qualquer endpoint da Star Citizen Wiki API" />
      <button type="button" class="btn-exec" id="btn-exec-route">IR</button>
    </div>
    <button class="btn-purge" id="btn-reset">LIMPAR</button>
  </section>

  <main class="grid" id="data-grid"></main>

  <div class="pagination-bar" id="pagination-bar" style="display:none;">
    <button class="btn-page" id="btn-prev-page">&lt; PÁGINA ANTERIOR</button>
    <span id="page-indicator" style="color:var(--neon-yellow);">PÁGINA 1 DE 1</span>
    <button class="btn-page" id="btn-next-page">PRÓXIMA PÁGINA &gt;</button>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-terminal" role="dialog" aria-modal="true">
      <div class="modal-top">
        <div>
          <span id="modal-sub" style="font-size:0.75rem;color:var(--neon-cyan);display:block;"></span>
          <h2 id="modal-title">DADOS DO SISTEMA</h2>
        </div>
        <button class="btn-close" id="modal-close">X</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    const BASE_API = 'https://api.star-citizen.wiki/api';
    const FLEETYARDS_FALLBACK = 'https://api.fleetyards.net/v1/models';

    let activeRoute = 'v2/vehicles';
    let currentItems = [];
    let currentPage = 1;
    let lastPage = 1;
    let totalRecords = 0;

    const LARGE_ENDPOINTS = new Set([
      'v2/items', 'v3/items', 'v2/comm-links', 'v2/galactapedia',
      'v2/celestial-objects', 'v2/clothing', 'v2/weapons', 'v2/armor'
    ]);

    const routeCache = new Map();
    const detailCache = new Map();

    const gridEl = document.getElementById('data-grid');
    const searchInput = document.getElementById('search-input');
    const filter1 = document.getElementById('filter-primary');
    const filter2 = document.getElementById('filter-secondary');
    const customRouteInput = document.getElementById('custom-route-input');
    const btnExecRoute = document.getElementById('btn-exec-route');
    const resetBtn = document.getElementById('btn-reset');
    const statRoute = document.getElementById('stat-route');
    const statTotal = document.getElementById('stat-total');
    const statShown = document.getElementById('stat-shown');
    const statusText = document.getElementById('status-text');
    const progressBar = document.getElementById('progress-bar');
    const paginationBar = document.getElementById('pagination-bar');
    const btnPrevPage = document.getElementById('btn-prev-page');
    const btnNextPage = document.getElementById('btn-next-page');
    const pageIndicator = document.getElementById('page-indicator');
    const modalOverlay = document.getElementById('modal-overlay');

    function getText(val, fallback = 'N/D') {
      if (val === null || val === undefined) return fallback;
      if (typeof val === 'string') return val.trim() || fallback;
      if (typeof val === 'number' || typeof val === 'boolean') return String(val);
      if (Array.isArray(val)) {
        const joined = val.map(x => getText(x, '')).filter(Boolean).join(' / ');
        return joined || fallback;
      }
      if (typeof val === 'object') {
        return val.en_EN || val.pt_BR || val.name || val.title || Object.values(val).find(v => typeof v === 'string') || fallback;
      }
      return fallback;
    }

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getHologramSVG(route) {
      if (route.includes('weapon')) {
        return `<svg class="holo-svg" viewBox="0 0 200 90" fill="none" stroke="#00f3ff" stroke-width="2">
          <path d="M20,45 L145,45 L165,38 L185,38 L185,48 L155,52 L130,52 L115,68 L95,68 L105,52 L55,52 L40,70 L22,70 L32,52 L20,52 Z" fill="rgba(0,243,255,0.08)"/>
          <line x1="65" y1="36" x2="125" y2="36" stroke="#ff0055" stroke-width="2"/>
          <circle cx="150" cy="43" r="3" fill="#fcee0a"/>
        </svg>`;
      }
      if (route.includes('armor') || route.includes('clothing')) {
        return `<svg class="holo-svg" viewBox="0 0 200 90" fill="none" stroke="#00f3ff" stroke-width="1.8">
          <polygon points="100,10 125,22 140,48 128,82 72,82 60,48 75,22" fill="rgba(0,243,255,0.08)"/>
          <polygon points="100,20 116,28 112,48 88,48 84,28" stroke="#fcee0a"/>
          <line x1="70" y1="58" x2="130" y2="58" stroke="#ff0055" stroke-dasharray="4 3"/>
        </svg>`;
      }
      if (route.includes('system') || route.includes('celestial') || route.includes('starmap')) {
        return `<svg class="holo-svg" viewBox="0 0 200 90" fill="none" stroke="#00f3ff" stroke-width="1.5">
          <circle cx="100" cy="45" r="14" fill="rgba(252,238,10,0.22)" stroke="#fcee0a" stroke-width="2"/>
          <ellipse cx="100" cy="45" rx="48" ry="15" stroke="#00f3ff"/>
          <ellipse cx="100" cy="45" rx="80" ry="26" stroke="#ff0055" stroke-dasharray="4 3"/>
          <circle cx="148" cy="45" r="4" fill="#00ff9d"/>
        </svg>`;
      }
      if (route.includes('galactapedia') || route.includes('comm-link')) {
        return `<svg class="holo-svg" viewBox="0 0 200 90" fill="none" stroke="#00f3ff" stroke-width="1.8">
          <rect x="45" y="14" width="110" height="62" fill="rgba(0,243,255,0.07)"/>
          <line x1="60" y1="28" x2="140" y2="28" stroke="#fcee0a" stroke-width="2"/>
          <line x1="60" y1="42" x2="130" y2="42" stroke="#00f3ff"/>
          <line x1="60" y1="54" x2="115" y2="54" stroke="#ff0055"/>
        </svg>`;
      }
      if (route.includes('vehicle')) {
        return `<svg class="holo-svg" viewBox="0 0 220 90" fill="none" stroke="#00f3ff" stroke-width="1.8">
          <polygon points="195,45 130,32 75,14 45,34 22,40 22,50 45,56 75,76 130,58" fill="rgba(0,243,255,0.08)"/>
          <polygon points="155,45 110,38 75,45 110,52" stroke="#fcee0a" stroke-width="1.5"/>
          <line x1="30" y1="45" x2="185" y2="45" stroke="#ff0055" stroke-dasharray="4 3"/>
        </svg>`;
      }
      return `<svg class="holo-svg" viewBox="0 0 200 90" fill="none" stroke="#00f3ff" stroke-width="1.8">
        <polygon points="100,12 155,34 155,66 100,84 45,66 45,34" fill="rgba(0,243,255,0.08)"/>
        <polygon points="100,25 135,40 135,60 100,72 65,60 65,40" stroke="#ff0055"/>
        <circle cx="100" cy="48" r="8" stroke="#fcee0a"/>
      </svg>`;
    }

    // Fallback resiliente caso a api.star-citizen.wiki sofra rate-limit/CORS
    async function fetchFleetYardsBackup() {
      const items = [];
      for (let p = 1; p <= 4; p++) {
        const res = await fetch(`${FLEETYARDS_FALLBACK}?per_page=100&page=${p}`);
        if (!res.ok) break;
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) break;
        data.forEach(m => {
          items.push({
            uuid: m.id,
            slug: m.slug,
            name: m.name,
            manufacturer: { name: m.manufacturer?.name || 'Desconhecido' },
            production_status: m.productionStatusLabel || m.productionStatus || 'Flight Ready',
            focus: m.focus || m.classificationLabel || 'Multifunção',
            cargo_capacity: m.cargo,
            crew: { min: m.minCrew, max: m.maxCrew },
            sizes: { length: m.length, beam: m.beam, height: m.height },
            mass: m.mass,
            speed: { scm: m.scmSpeed, max: m.afterburnerSpeed },
            msrp: m.lastPledgePrice || m.pledgePrice,
            description: m.description,
            _image: m.storeImageLarge || m.storeImageMedium || m.storeImage || ''
          });
        });
      }
      return items;
    }

    async function loadRoute(route, page = 1) {
      const cleanRoute = route.replace(/^\/+|\/+$/g, '');
      activeRoute = cleanRoute;
      currentPage = page;
      statRoute.textContent = `/${cleanRoute}`;

      searchInput.value = '';
      filter1.value = '';
      filter2.value = '';
      paginationBar.style.display = 'none';

      const cacheKey = `${cleanRoute}:p${page}`;
      if (routeCache.has(cacheKey)) {
        const cached = routeCache.get(cacheKey);
        currentItems = cached.items;
        lastPage = cached.lastPage;
        totalRecords = cached.total;
        statTotal.textContent = totalRecords;
        progressBar.style.width = '100%';
        statusText.textContent = `[CACHE] /${cleanRoute.toUpperCase()} CARREGADO (${currentItems.length} ITENS EXIBIDOS DE ${totalRecords})`;
        updatePaginationUI();
        buildDynamicFilters(currentItems);
        renderCards();
        return;
      }

      statusText.textContent = `[NET] CONECTANDO A ${BASE_API}/${cleanRoute}?page=${page}...`;
      progressBar.style.width = '18%';
      progressBar.style.background = 'linear-gradient(90deg, var(--neon-pink), var(--neon-cyan))';
      gridEl.innerHTML = '';

      try {
        const res = await fetch(`${BASE_API}/${cleanRoute}?limit=100&page=${page}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const json = await res.json();
        let fetched = Array.isArray(json.data) ? [...json.data] : (json.data ? [json.data] : []);
        lastPage = json.meta?.last_page || 1;
        totalRecords = json.meta?.total || fetched.length;

        if (!LARGE_ENDPOINTS.has(cleanRoute) && lastPage > 1 && lastPage <= 6 && page === 1) {
          statTotal.textContent = fetched.length;
          progressBar.style.width = `${Math.round((1 / lastPage) * 100)}%`;

          const pageNums = [];
          for (let p = 2; p <= lastPage; p++) pageNums.push(p);

          const batchResults = await Promise.all(
            pageNums.map(p =>
              fetch(`${BASE_API}/${cleanRoute}?limit=100&page=${p}`)
                .then(r => r.ok ? r.json() : { data: [] })
                .catch(() => ({ data: [] }))
            )
          );

          batchResults.forEach(r => {
            if (Array.isArray(r.data)) fetched.push(...r.data);
          });
          lastPage = 1;
        }

        currentItems = fetched;
        routeCache.set(cacheKey, { items: currentItems, lastPage, total: totalRecords });

        statTotal.textContent = totalRecords;
        progressBar.style.width = '100%';
        statusText.textContent = `[ONLINE] /${cleanRoute.toUpperCase()} — ${currentItems.length} REGISTROS SINCRONIZADOS (TOTAL: ${totalRecords})`;

        updatePaginationUI();
        buildDynamicFilters(currentItems);
        renderCards();

      } catch (err) {
        console.warn('API principal falhou, tentando fallback se aplicável:', err);
        if (cleanRoute.includes('vehicles')) {
          statusText.textContent = '[FALLBACK] CARREGANDO BANCO DE DADOS DE RESERVA (FLEETYARDS)...';
          try {
            const backupItems = await fetchFleetYardsBackup();
            if (backupItems.length > 0) {
              currentItems = backupItems;
              lastPage = 1;
              totalRecords = backupItems.length;
              routeCache.set(cacheKey, { items: currentItems, lastPage: 1, total: totalRecords });
              statTotal.textContent = totalRecords;
              progressBar.style.width = '100%';
              statusText.textContent = `[ONLINE-BACKUP] ${totalRecords} NAVES CARREGADAS COM SUCESSO`;
              updatePaginationUI();
              buildDynamicFilters(currentItems);
              renderCards();
              return;
            }
          } catch (e2) {
            console.error(e2);
          }
        }

        statusText.textContent = `[ERRO] FALHA AO ACESSAR /${cleanRoute.toUpperCase()} (${err.message})`;
        progressBar.style.background = '#ff0055';
        gridEl.innerHTML = `<div class="empty-msg">[!] FALHA DE CONEXÃO COM /${esc(cleanRoute)}. TENTE OUTRA ABA ACIMA OU RECARREGUE A PÁGINA.</div>`;
      }
    }

    function updatePaginationUI() {
      if (lastPage > 1) {
        paginationBar.style.display = 'flex';
        pageIndicator.textContent = `PÁGINA ${currentPage} DE ${lastPage} (TOTAL: ${totalRecords})`;
        btnPrevPage.disabled = currentPage <= 1;
        btnNextPage.disabled = currentPage >= lastPage;
      } else {
        paginationBar.style.display = 'none';
      }
    }

    function buildDynamicFilters(items) {
      const f1Set = new Set();
      const f2Set = new Set();

      items.forEach(it => {
        const cat1 = it.manufacturer?.name || getText(it.type, '') || getText(it.category, '');
        if (cat1 && cat1 !== 'N/D') f1Set.add(cat1);

        const cat2 = getText(it.production_status, '') || getText(it.size, '') || getText(it.affiliation, '') || getText(it.sub_type, '');
        if (cat2 && cat2 !== 'N/D' && cat2 !== cat1) f2Set.add(cat2);
      });

      populateSelect(filter1, [...f1Set].sort(), '[CATEGORIA / FABRICANTE: TODOS]');
      populateSelect(filter2, [...f2Set].sort(), '[STATUS / CLASSE: TODOS]');
    }

    function populateSelect(el, list, defaultText) {
      el.innerHTML = `<option value="">${defaultText}</option>` +
        list.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    }

    function extractCardMetadata(it) {
      const title = getText(it.name || it.title || it.code || it.slug, 'REGISTRO SEM NOME');
      const code = (it.uuid || it.id || it.code || it.slug || 'SYS').toString().slice(0, 10).toUpperCase();
      const badge = getText(it.production_status || it.type || it.category || it.status, activeRoute.split('/')[1]?.toUpperCase() || 'DATA');
      const subtitle = it.manufacturer?.name || getText(it.system?.name || it.affiliation || it.sub_type || it.series, activeRoute.toUpperCase());
      const desc = getText(it.description || it.excerpt || it.body || it.focus || it.known_for, 'Clique para inspecionar telemetria completa e JSON bruto.');

      const metrics = [];
      if (it.cargo_capacity != null) metrics.push(['CARGA', `${it.cargo_capacity} SCU`]);
      if (it.crew?.max != null || it.max_crew != null) metrics.push(['TRIPULAÇÃO', it.crew?.max ?? it.max_crew]);
      if (it.sizes?.length != null || it.length != null) metrics.push(['COMPR.', `${it.sizes?.length ?? it.length}m`]);
      if (it.size != null && metrics.length < 3) metrics.push(['TAMANHO', getText(it.size)]);
      if (it.grade != null && metrics.length < 3) metrics.push(['GRADE', getText(it.grade)]);
      if (it.class != null && metrics.length < 3) metrics.push(['CLASSE', getText(it.class)]);
      if (it.mass != null && metrics.length < 3) metrics.push(['MASSA', `${Number(it.mass).toLocaleString('pt-BR')}kg`]);
      if (it.msrp != null && metrics.length < 3) metrics.push(['MSRP', `$${it.msrp}`]);
      if (it.symbol != null && metrics.length < 3) metrics.push(['SÍMBOLO', it.symbol]);
      if (it.code != null && metrics.length < 3) metrics.push(['CÓDIGO', it.code]);
      if (it.published_at != null && metrics.length < 3) metrics.push(['DATA', String(it.published_at).slice(0, 10)]);

      while (metrics.length < 3) {
        metrics.push(['ROTA', activeRoute.split('/')[1] || 'API']);
      }

      return { title, code, badge, subtitle, desc, metrics: metrics.slice(0, 3) };
    }

    function renderCards() {
      const q = searchInput.value.trim().toLowerCase();
      const v1 = filter1.value;
      const v2 = filter2.value;

      const filtered = currentItems.filter(it => {
        const meta = extractCardMetadata(it);
        const hay = `${meta.title} ${meta.subtitle} ${meta.desc} ${meta.code}`.toLowerCase();
        if (q && !hay.includes(q)) return false;

        if (v1) {
          const cat1 = it.manufacturer?.name || getText(it.type, '') || getText(it.category, '');
          if (cat1 !== v1) return false;
        }
        if (v2) {
          const cat2 = getText(it.production_status, '') || getText(it.size, '') || getText(it.affiliation, '') || getText(it.sub_type, '');
          if (cat2 !== v2) return false;
        }
        return true;
      });

      statShown.textContent = filtered.length;

      if (filtered.length === 0) {
        gridEl.innerHTML = `<div class="empty-msg">[!] NENHUM REGISTRO ENCONTRADO PARA OS FILTROS APLICADOS.</div>`;
        return;
      }

      const frag = document.createDocumentFragment();

      filtered.forEach(it => {
        const meta = extractCardMetadata(it);
        const card = document.createElement('article');
        card.className = 'cyber-card';

        const lowBadge = meta.badge.toLowerCase();
        const badgeCls = lowBadge.includes('flight') || lowBadge.includes('ready') ? 'st-green' :
                         (lowBadge.includes('concept') ? 'st-yellow' : 'st-pink');

        const visualHtml = it._image
          ? `<img src="${esc(it._image)}" alt="${esc(meta.title)}" loading="lazy" onerror="this.outerHTML=getHologramSVG(activeRoute)">`
          : getHologramSVG(activeRoute);

        card.innerHTML = `
          <div class="holo-viewport">
            <div class="holo-scan"></div>
            <span class="holo-code">ID // ${esc(meta.code)}</span>
            <span class="holo-status ${badgeCls}">${esc(meta.badge)}</span>
            ${visualHtml}
          </div>
          <div class="card-content">
            <div>
              <div class="card-mfg">${esc(meta.subtitle)}</div>
              <h3 class="card-title">${esc(meta.title)}</h3>
              <div class="card-role">${esc(meta.desc.slice(0, 95))}${meta.desc.length > 95 ? '...' : ''}</div>
            </div>
            <div class="card-metrics">
              ${meta.metrics.map(([k, v]) => `
                <div class="metric"><small>${esc(k)}</small><strong>${esc(String(v))}</strong></div>
              `).join('')}
            </div>
          </div>
        `;

        card.addEventListener('click', () => openModal(it));
        frag.appendChild(card);
      });

      gridEl.innerHTML = '';
      gridEl.appendChild(frag);
    }

    async function openModal(item) {
      const meta = extractCardMetadata(item);
      document.getElementById('modal-title').textContent = meta.title;

      const lookupId = item.uuid || item.slug || item.id || item.code;
      const endpointUrl = lookupId ? `${BASE_API}/${activeRoute}/${encodeURIComponent(lookupId)}` : `${BASE_API}/${activeRoute}`;
      document.getElementById('modal-sub').textContent = `SUPER VELOZ // ${endpointUrl}`;
      modalOverlay.classList.add('open');

      const cacheKey = `${activeRoute}:${lookupId || meta.title}`;
      renderModalBody(item, true);

      if (detailCache.has(cacheKey)) {
        renderModalBody(detailCache.get(cacheKey), false);
        return;
      }

      if (lookupId && !item._image) {
        try {
          const res = await fetch(endpointUrl);
          if (res.ok) {
            const json = await res.json();
            const fullData = json.data ? { ...item, ...json.data } : item;
            detailCache.set(cacheKey, fullData);
            renderModalBody(fullData, false);
            return;
          }
        } catch (e) {
          console.warn('Detalhe individual indisponível.');
        }
      }

      renderModalBody(item, false);
    }

    function renderModalBody(data, isLoading) {
      const desc = getText(data.description || data.body || data.excerpt, 'Sem descrição textual adicional registrada neste nó da API.');
      const wikiUrl = data.web_url || data.rsi_url || `https://starcitizen.tools/${encodeURIComponent(getText(data.name || data.title, '').replace(/\s+/g, '_'))}`;

      const specs = [];
      Object.entries(data).forEach(([key, val]) => {
        if (val === null || val === undefined || key.startsWith('_') || key === 'description' || key === 'body' || key === 'excerpt' || key === 'link' || key === 'web_url') return;
        if (typeof val !== 'object') {
          specs.push([key.replace(/_/g, ' '), String(val)]);
        } else if (!Array.isArray(val)) {
          Object.entries(val).forEach(([subKey, subVal]) => {
            if (subVal !== null && subVal !== undefined && typeof subVal !== 'object') {
              specs.push([`${key}.${subKey}`.replace(/_/g, ' '), String(subVal)]);
            }
          });
        }
      });

      document.getElementById('modal-body').innerHTML = `
        ${isLoading ? `<div style="color:var(--neon-yellow);margin-bottom:0.8rem;">[SYNC] COLETANDO TELEMETRIA COMPLETA DA API...</div>` : ''}
        ${data._image ? `<img class="modal-hero" src="${esc(data._image)}" alt="${esc(getText(data.name))}">` : ''}
        <p class="modal-desc">${esc(desc)}</p>
        <div class="modal-specs">
          ${specs.slice(0, 16).map(([k, v]) => `
            <div class="spec-box">
              <span>${esc(k)}</span>
              <strong>${esc(v)}</strong>
            </div>
          `).join('')}
        </div>
        <div class="modal-footer-btns">
          <a class="btn-cyber-link" href="${esc(wikiUrl)}" target="_blank" rel="noopener noreferrer">ABRIR FONTE OFICIAL &nearr;</a>
          <button type="button" class="btn-json" id="btn-toggle-json">{ } VER JSON COMPLETO DA API</button>
        </div>
        <pre class="raw-json" id="raw-json-box">${esc(JSON.stringify(data, null, 2))}</pre>
      `;

      document.getElementById('btn-toggle-json').addEventListener('click', () => {
        const pre = document.getElementById('raw-json-box');
        pre.style.display = pre.style.display === 'block' ? 'none' : 'block';
      });
    }

    document.getElementById('nav-bar').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadRoute(btn.getAttribute('data-route'), 1);
    });

    btnExecRoute.addEventListener('click', () => {
      const custom = customRouteInput.value.trim();
      if (!custom) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      loadRoute(custom, 1);
    });

    customRouteInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnExecRoute.click();
    });

    btnPrevPage.addEventListener('click', () => {
      if (currentPage > 1) loadRoute(activeRoute, currentPage - 1);
    });

    btnNextPage.addEventListener('click', () => {
      if (currentPage < lastPage) loadRoute(activeRoute, currentPage + 1);
    });

    searchInput.addEventListener('input', renderCards);
    filter1.addEventListener('change', renderCards);
    filter2.addEventListener('change', renderCards);

    resetBtn.addEventListener('click', () => {
      searchInput.value = '';
      filter1.value = '';
      filter2.value = '';
      renderCards();
    });

    document.getElementById('modal-close').addEventListener('click', () => modalOverlay.classList.remove('open'));
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('open'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modalOverlay.classList.remove('open'); });

    // Inicializa carregando /v2/vehicles
    loadRoute('v2/vehicles', 1);
  </script>
</body>
